spring:
  application:
    name: mostrador
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mostrador
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
