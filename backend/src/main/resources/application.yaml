# Configuración base de Mostrador (API en el puerto 8080).
# El password de MySQL va en application-local.yaml (no se commitea).
spring:
  application:
    name: mostrador
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mostrador
    username: mostrador
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo versiona Flyway; Hibernate solo valida que coincida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mostrador:
  # Carpeta de fotos en disco. En producción conviene una ruta absoluta fija.
  upload-dir: uploads

server:
  port: 8080
